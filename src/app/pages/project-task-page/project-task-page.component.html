@if (currentProject()?.isArchived) {
  <div class="archived-notice">
    <span>
      {{
        (currentProject()?.isDone
          ? T.F.PROJECT.COMPLETE.NOTICE
          : T.F.PROJECT.ARCHIVED_NOTICE
        ) | translate
      }}
    </span>
    <button
      mat-button
      (click)="restoreProject()"
    >
      {{
        (currentProject()?.isDone
          ? T.F.PROJECT.COMPLETE.REOPEN
          : T.F.PROJECT.ARCHIVED_PROJECTS.UNARCHIVE
        ) | translate
      }}
    </button>
  </div>
}
@switch (layout()) {
  @case ('board') {
    @if (projectId(); as boardProjectId) {
      <section-board
        class="layout-content"
        [projectId]="boardProjectId"
        [tasks]="undoneTasks()"
      ></section-board>
    }
  }
  @case ('calendar') {
    <schedule
      class="layout-content"
      [scope]="scope()"
    ></schedule>
  }
  @case ('upcoming') {
    <planner
      class="layout-content"
      [scope]="scope()"
    ></planner>
  }
  @default {
    <work-view
      [unclaimedTasks]="unclaimedTasks()"
      [backlogTasks]="backlogTasks()"
      [doneTasks]="doneTasks()"
      [isShowBacklog]="isShowBacklog()"
      [undoneTasks]="undoneTasks()"
    ></work-view>
  }
}
