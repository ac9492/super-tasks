<form (ngSubmit)="save()">
  <h2 mat-dialog-title>
    @if (!dialogData.simpleCounter.id) {
      {{ T.F.SIMPLE_COUNTER.HABIT_TRACKER.ADD_HABIT | translate }}
    } @else if (dialogData.simpleCounter.title) {
      {{ dialogData.simpleCounter.title }} – {{ T.MH.SETTINGS | translate }}
    } @else {
      {{ T.MH.SETTINGS | translate }}
    }
  </h2>

  <mat-dialog-content>
    <formly-form
      [fields]="fields"
      [form]="form"
      [(model)]="model"
      [options]="formOptions"
    >
    </formly-form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    @if (dialogData.simpleCounter.id) {
      <button
        class="dialog-action-start"
        mat-stroked-button
        color="warn"
        type="button"
        (click)="delete()"
      >
        {{ T.G.DELETE | translate }}
      </button>
    }
    <button
      mat-button
      type="button"
      (click)="close()"
    >
      {{ T.G.CANCEL | translate }}
    </button>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="!isDirty()"
    >
      {{ T.G.SAVE | translate }}
    </button>
  </mat-dialog-actions>
</form>
