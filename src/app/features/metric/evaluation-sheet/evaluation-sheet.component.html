@if (metricForDay(); as metric) {
  <div class="radio-group">
    <label>{{ T.F.METRIC.EVAL_FORM.IMPACT_OF_WORK | translate }}</label>
    <impact-stars
      #impactOfWork="ngModel"
      (ngModelChange)="updateImpactOfWork($event)"
      [ngModel]="metric.impactOfWork || 0"
      name="impactOfWork"
      [maxStars]="4"
      ariaLabel="How impactful was your work today?"
      zeroLabel="No impact"
      lowLabel="Low impact"
      highLabel="High impact"
    ></impact-stars>
    <div class="hint">{{ T.F.METRIC.EVAL_FORM.IMPACT_OF_WORK_HINT | translate }}</div>
  </div>

  <div class="radio-group">
    <label>{{ T.F.METRIC.EVAL_FORM.ENERGY_LEVEL | translate }}</label>
    <mat-radio-group
      #energyCheckin="ngModel"
      (ngModelChange)="updateEnergyCheckin($event)"
      [ngModel]="metric.energyCheckin"
      name="energyCheckin"
      [attr.aria-label]="T.F.METRIC.EVAL_FORM.ENERGY_LEVEL | translate"
    >
      <mat-radio-button [value]="1">
        <span class="energy-option">
          <mat-icon>battery_0_bar</mat-icon>
          {{ T.F.METRIC.EVAL_FORM.ENERGY_LOW | translate }}
        </span>
      </mat-radio-button>
      <mat-radio-button [value]="2">
        <span class="energy-option">
          <mat-icon>battery_3_bar</mat-icon>
          {{ T.F.METRIC.EVAL_FORM.ENERGY_MEDIUM | translate }}
        </span>
      </mat-radio-button>
      <mat-radio-button [value]="3">
        <span class="energy-option">
          <mat-icon>battery_full</mat-icon>
          {{ T.F.METRIC.EVAL_FORM.ENERGY_HIGH | translate }}
        </span>
      </mat-radio-button>
    </mat-radio-group>
  </div>

  <reflection-note [dayStr]="day()"></reflection-note>
