<!-- Names the dialog; schedule and deadline dialogs otherwise look alike. -->
<h2 mat-dialog-title>{{ T.F.TASK.ADDITIONAL_INFO.DEADLINE | translate }}</h2>
<mat-dialog-content>
  @if (isConfigReady()) {
    <datetime-picker
      [selectedDate]="selectedDate"
      [selectedTime]="selectedTime"
      [selectedReminderCfgId]="selectedReminderCfgId"
      [reminderOptions]="reminderOptions"
      [minDate]="minDate"
      [timeLabel]="T.F.TASK.D_DEADLINE.ADD_TIME | translate"
      [reminderLabel]="T.F.TASK.D_DEADLINE.REMIND_AT"
      (dateSelected)="dateSelected($event)"
      (timeChanged)="selectedTime = $event"
      (reminderChanged)="selectedReminderCfgId = $event"
      (quickAccessClick)="onQuickAccessClick($event)"
      (enterSubmit)="submit()"
    ></datetime-picker>
    @if (selectedTime && selectedReminderCfgId !== DO_NOT_REMIND) {
      <exact-alarm-hint />
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (hasExistingDeadline && !data.isSelectDeadlineOnly) {
    <button
      (click)="remove()"
      class="dialog-action-start"
      color="warn"
      mat-stroked-button
      type="button"
    >
      <mat-icon>flag</mat-icon>
      <span class="action-label">
        {{ T.F.TASK.D_DEADLINE.REMOVE_DEADLINE | translate }}
      </span>
    </button>
  }
  <button
    mat-button
    (click)="close()"
    type="button"
  >
    <span class="action-label">{{ T.G.CANCEL | translate }}</span>
  </button>
  <button
    color="primary"
    mat-flat-button
    [disabled]="!selectedDate"
    (click)="submit()"
    type="button"
  >
    <mat-icon>flag</mat-icon>
    <span class="action-label">
      {{ T.F.TASK.D_DEADLINE.SET_DEADLINE | translate }}
    </span>
  </button>
</mat-dialog-actions>
