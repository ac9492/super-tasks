<h2 mat-dialog-title>{{ T.F.FOCUS_MODE.FLOWTIME_SETTINGS | translate }}</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <formly-form
      [fields]="fields()"
      [form]="form"
      [model]="model()"
      (modelChange)="model.set($event)"
    ></formly-form>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    (click)="close()"
  >
    {{ T.G.CANCEL | translate }}
  </button>
  <button
    mat-flat-button
    color="primary"
    (click)="save()"
  >
    {{ T.G.SAVE | translate }}
  </button>
</mat-dialog-actions>
