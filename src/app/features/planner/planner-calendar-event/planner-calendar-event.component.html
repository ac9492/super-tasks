<button
  type="button"
  class="event-content"
  [matMenuTriggerFor]="contextMenu"
  (click)="$event.stopPropagation()"
>
  <span class="icon">
    <mat-icon>{{ calendarEvent().icon || 'event' }}</mat-icon>
    @if (hasColorDot()) {
      <span class="color-dot"></span>
    }
  </span>
  <span class="title">
    {{ calendarEvent().title }}
  </span>
  <span class="planner-time-remaining-shared">
    {{ calendarEvent().duration | msToString }}
  </span>
  @if (showStartTime()) {
    <span
      class="start-time"
      [innerHTML]="calendarEvent().start | shortPlannedAt"
    ></span>
  }
</button>
<mat-menu #contextMenu="matMenu">
  @if (hasEventUrl()) {
    <button
      mat-menu-item
      (click)="openEventLink()"
    >
      <mat-icon>open_in_new</mat-icon>
      {{ T.F.CALENDARS.CONTEXT_MENU.OPEN_IN_CALENDAR | translate }}
    </button>
  }
  @if (isPluginEvent()) {
    <button
      mat-menu-item
      (click)="reschedule()"
    >
      <mat-icon>schedule</mat-icon>
      {{ T.F.CALENDARS.CONTEXT_MENU.RESCHEDULE | translate }}
    </button>
  }
  <button
    mat-menu-item
    (click)="createAsTask()"
  >
    <mat-icon>add</mat-icon>
    {{ T.F.CALENDARS.CONTEXT_MENU.CREATE_TASK | translate }}
  </button>
  <button
    mat-menu-item
    (click)="hide()"
  >
    <mat-icon>visibility_off</mat-icon>
    {{ T.G.HIDE | translate }}
  </button>
  @if (isPluginEvent()) {
    <button
      mat-menu-item
      (click)="deleteEvent()"
    >
      <mat-icon color="warn">delete</mat-icon>
      {{ T.F.CALENDARS.CONTEXT_MENU.DELETE_EVENT | translate }}
    </button>
  }
</mat-menu>
