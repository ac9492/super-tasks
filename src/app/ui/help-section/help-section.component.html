<button
  (click)="isShowHelp = !isShowHelp"
  [attr.aria-label]="T.MH.HELP | translate"
  [attr.aria-expanded]="isShowHelp"
  class="help-btn"
  mat-icon-button
  type="button"
>
  <mat-icon>{{ isShowHelp ? 'close' : 'help_outline' }}</mat-icon>
</button>

@if (isShowHelp) {
  <div
    [@expandFade]
    class="help-text"
  >
    <ng-content></ng-content>
  </div>
}
