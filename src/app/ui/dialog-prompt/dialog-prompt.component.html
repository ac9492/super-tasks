<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  @if (isMessageHtml) {
    <div [innerHtml]="message"></div>
  }

  <form
    #formEl="ngForm"
    (ngSubmit)="formEl.valid && close(true)"
  >
    <mat-form-field>
      <mat-label>{{ data.placeholder | translate }}</mat-label>
      <input
        [(ngModel)]="txtVal"
        name="txtVal"
        matInput
        required
        [type]="data.type || 'text'"
      />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="wrap-buttons">
    <button
      (click)="close(false)"
      mat-button
      type="button"
    >
      {{ data.cancelTxt || T.G.CANCEL | translate }}
    </button>

    <button
      (click)="close(true)"
      color="primary"
      mat-flat-button
    >
      {{ data.saveTxt || T.G.SAVE | translate }}
    </button>
  </div>
</mat-dialog-actions>
