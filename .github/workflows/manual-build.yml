name: Manual Build Windows Release & Mac
run-name: Super Tasks macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-electron-build
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend and desktop code
        run: npm run buildFrontend:prod:es6 && npm run electron:build
      - name: Build unsigned Intel and Apple Silicon packages
        run: npx electron-builder --config electron-builder.super-tasks.cjs --mac dmg zip --x64 --arm64 --publish never
      - name: Check app identities and runtime dependencies
        shell: bash
        run: |
          for app in .tmp/super-tasks-builds/mac*/"Super Tasks.app"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Contents/Info.plist")" = "Super Tasks"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = "io.github.ac9492.supertasks"
            node tools/verify-electron-requires.js "$app/Contents/Resources/app.asar"
          done
          shasum -a 256 .tmp/super-tasks-builds/*.dmg .tmp/super-tasks-builds/*.zip > .tmp/super-tasks-builds/SHA256SUMS-mac.txt
      - name: Launch the native Mac app with an isolated profile
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then appdir=mac-arm64; else appdir=mac; fi
          node tools/smoke-super-tasks.cjs ".tmp/super-tasks-builds/$appdir/Super Tasks.app/Contents/MacOS/Super Tasks"
      - name: Upload macOS downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Super-Tasks-macOS
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/super-tasks-builds/*.dmg
            .tmp/super-tasks-builds/*.zip
            .tmp/super-tasks-builds/SHA256SUMS-mac.txt
