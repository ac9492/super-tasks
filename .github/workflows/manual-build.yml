name: Manual Build Windows Release & Mac
run-name: Ultra Tasks macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-electron-build
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend and desktop code
        run: npm run buildFrontend:prod:es6 && npm run electron:build
      - name: Build ad-hoc-signed Intel and Apple Silicon packages
        run: npx electron-builder --config electron-builder.ultra-tasks.cjs --mac dmg zip --x64 --arm64 --publish never
      - name: Check app identities and runtime dependencies
        shell: bash
        run: |
          for app in .tmp/ultra-tasks-builds/mac*/"Ultra Tasks.app"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Contents/Info.plist")" = "Ultra Tasks"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = "app.ultratasks"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app"
            node tools/verify-electron-requires.js "$app/Contents/Resources/app.asar"
          done
          shasum -a 256 .tmp/ultra-tasks-builds/*.dmg .tmp/ultra-tasks-builds/*.zip > .tmp/ultra-tasks-builds/SHA256SUMS-mac.txt
      - name: Verify signatures inside the distributable disk images
        shell: bash
        run: |
          for image in .tmp/ultra-tasks-builds/*.dmg; do
            mountpoint="$(mktemp -d)"
            hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mountpoint"
            codesign --verify --deep --strict --verbose=2 "$mountpoint/Ultra Tasks.app"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint"
          done
      - name: Launch the native Mac app with an isolated profile
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then appdir=mac-arm64; else appdir=mac; fi
          node tools/smoke-ultra-tasks.cjs ".tmp/ultra-tasks-builds/$appdir/Ultra Tasks.app/Contents/MacOS/Ultra Tasks"
      - name: Upload macOS downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ultra-Tasks-macOS
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/ultra-tasks-builds/*.dmg
            .tmp/ultra-tasks-builds/*.zip
            .tmp/ultra-tasks-builds/SHA256SUMS-mac.txt
