name: Desktop GitHub Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-github-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-electron-build
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - run: npm run int:test
      - run: npm run buildFrontend:e2e
      - name: Verify settings and plugin flows
        run: npx playwright test --config e2e/playwright.config.ts e2e/tests/settings/settings-dialog.spec.ts e2e/tests/plugins/plugin-feature-check.spec.ts e2e/tests/plugins/plugin-upload.spec.ts e2e/tests/plugins/plugin-loading.spec.ts e2e/tests/plugins/doc-mode-bundled.spec.ts --workers=2 --retries=0
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-electron-build
      - name: Install Linux packaging and display dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: npm ci
      - run: npm run buildFrontend:prod:es6
      - run: npm run electron:build
      - name: Package desktop downloads
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            npx electron-builder --config electron-builder.desktop.yaml --linux AppImage deb rpm --x64 --publish never
          else
            npx electron-builder --config electron-builder.desktop.yaml --${{ matrix.platform }} --publish never
          fi
      - name: Verify packaged require targets
        shell: bash
        run: |
          find .tmp/app-builds -name app.asar -print -exec node tools/verify-electron-requires.js '{}' \;
      - name: Smoke test packaged app
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'win' ]; then
            SOURCE='.tmp/app-builds/win-unpacked'
            EXECUTABLE='Ultra Tasks.exe'
          elif [ '${{ matrix.platform }}' = 'linux' ]; then
            SOURCE='.tmp/app-builds/linux-unpacked'
            EXECUTABLE='ultratasks'
          elif [ "$(node -p process.arch)" = 'arm64' ]; then
            SOURCE='.tmp/app-builds/mac-arm64'
            EXECUTABLE='Ultra Tasks.app/Contents/MacOS/Ultra Tasks'
          else
            SOURCE='.tmp/app-builds/mac'
            EXECUTABLE='Ultra Tasks.app/Contents/MacOS/Ultra Tasks'
          fi
          # The shared smoke test also verifies URLs from a path containing '#'.
          mv "$SOURCE" "${SOURCE} # packaged app"
          APP="${SOURCE} # packaged app/$EXECUTABLE"
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node e2e/electron/packaged-app-smoke.cjs "$APP"
          else
            node e2e/electron/packaged-app-smoke.cjs "$APP"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            .tmp/app-builds/*.exe
            .tmp/app-builds/*.dmg
            .tmp/app-builds/*.zip
            .tmp/app-builds/*.AppImage
            .tmp/app-builds/*.deb
            .tmp/app-builds/*.rpm
          if-no-files-found: error
  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish verified desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="ultra-tasks-v${VERSION}"
          test "$(find downloads -name '*.exe' | wc -l)" -eq 2
          test "$(find downloads -name '*.dmg' | wc -l)" -eq 3
          test "$(find downloads -name '*.zip' | wc -l)" -eq 2
          test "$(find downloads -name '*.AppImage' | wc -l)" -eq 1
          test "$(find downloads -name '*.deb' | wc -l)" -eq 1
          test "$(find downloads -name '*.rpm' | wc -l)" -eq 1
          (cd downloads && sha256sum * > SHA256SUMS.txt)
          # GITHUB_TOKEN deliberately prevents inherited tag/release workflows
          # from submitting this GitHub-only release to upstream stores.
          gh release create "$TAG" downloads/* --target "$GITHUB_SHA" --title "Ultra Tasks ${VERSION}" --notes-file build/desktop-release-notes.md --draft
          gh release edit "$TAG" --draft=false --latest
