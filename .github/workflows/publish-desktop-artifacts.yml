name: Publish Verified Desktop Artifacts
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Desktop GitHub Release run with successful validation and package jobs
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Verify source build checks
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/source-run.json
          test "$(jq -r .path /tmp/source-run.json)" = '.github/workflows/desktop-release.yml'
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs" > /tmp/source-jobs.json
          jq -e '[.jobs[] | select(.name == "validate" or .name == "package (windows-latest, win)" or .name == "package (macos-15, mac)") | select(.conclusion == "success")] | length == 3' /tmp/source-jobs.json
          echo "sha=$(jq -r .head_sha /tmp/source-run.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish tested packages
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="ultra-tasks-v${VERSION}"
          test "$(find downloads -name '*.exe' | wc -l)" -eq 2
          test "$(find downloads -name '*.dmg' | wc -l)" -eq 3
          test "$(find downloads -name '*.zip' | wc -l)" -eq 2
          (cd downloads && sha256sum * > SHA256SUMS.txt)
          cp build/desktop-release-notes.md /tmp/notes.md
          printf '\nA Universal Mac DMG supporting both Intel and Apple Silicon is also included.\n' >> /tmp/notes.md
          # GITHUB_TOKEN avoids triggering the inherited store-publishing workflows.
          gh release create "$TAG" downloads/* --target "$SOURCE_SHA" --title "Ultra Tasks ${VERSION}" --notes-file /tmp/notes.md --draft
          gh release edit "$TAG" --draft=false --latest
